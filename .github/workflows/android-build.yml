name: Android Build

on:
  workflow_dispatch:
    inputs:
      run_emulator_smoke:
        description: Build x86_64 and run the Android emulator smoke test
        required: true
        default: false
        type: boolean
      build_full_release:
        description: Build signed ARM64 APK and multi-ABI AAB (requires Android signing secrets)
        required: true
        default: false
        type: boolean
  push:
    branches:
      - production
      - 'feat/android-*'
    paths:
      - '.github/actions/setup-android-build/**'
      - '.github/scripts/android-*'
      - '.github/scripts/configure-android.mjs'
      - '.github/workflows/android-build.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'src-tauri/**'
      - 'index.html'
      - 'vite.config.*'
      - 'version.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/setup-android-build/**'
      - '.github/scripts/android-*'
      - '.github/scripts/configure-android.mjs'
      - '.github/workflows/android-build.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'src-tauri/**'
      - 'index.html'
      - 'vite.config.*'
      - 'version.json'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  VITE_RISU_LEGAL_CONFIGURED: 'TRUE'
  ANDROID_NDK_VERSION: '28.2.13676358'
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
  ANDROID_MIN_TARGET_SDK: '35'

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Run unit tests
        run: pnpm test
        env:
          NODE_OPTIONS: --no-experimental-webstorage

  build-installable:
    name: Build installable ARM64 debug APK
    needs: validate
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (!inputs.run_emulator_smoke && !inputs.build_full_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_STRIP: symbols
      VITE_ANDROID_CI_LIGHT: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build
        with:
          rust-targets: aarch64-linux-android

      - name: Build ARM64 debug APK
        run: pnpm tauri android build --debug --apk --target aarch64 --split-per-abi --ci

      - name: Verify and measure installable APK
        shell: bash
        env:
          ANDROID_EXPECTED_ABI: arm64-v8a
          ANDROID_MAX_APK_BYTES: '167772160'
          ANDROID_SIZE_REPORT: android-arm64-size.txt
        run: |
          mkdir -p android-output
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*debug*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" android-output/RisuAI-Android-arm64-debug.apk
          bash .github/scripts/android-artifact-report.sh android-output/RisuAI-Android-arm64-debug.apk

      - name: Read application version
        id: app-version
        shell: bash
        run: echo "value=$(jq -r '.version' version.json)" >> "$GITHUB_OUTPUT"

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RisuAI-Android-installable-arm64-v${{ steps.app-version.outputs.value }}
          path: |
            android-output/RisuAI-Android-arm64-debug.apk
            android-arm64-size.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

  android-smoke:
    name: Build x86_64 and run emulator smoke test
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_STRIP: symbols
      VITE_ANDROID_CI_LIGHT: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build
        with:
          rust-targets: x86_64-linux-android

      - name: Build x86_64 smoke APK
        run: pnpm tauri android build --debug --apk --target x86_64 --split-per-abi --ci

      - name: Verify and measure smoke APK
        shell: bash
        env:
          ANDROID_EXPECTED_ABI: x86_64
          ANDROID_MAX_APK_BYTES: '167772160'
          ANDROID_SIZE_REPORT: android-x86_64-size.txt
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*debug*.apk' -print -quit)"
          test -n "$apk"
          bash .github/scripts/android-artifact-report.sh "$apk"

      - name: Setup Android emulator SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          cmdline-tools-version: 14742923
          packages: >-
            platform-tools
            emulator
            platforms;android-35
            system-images;android-35;google_apis;x86_64

      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          adb start-server

      - name: Install, launch, and restart RisuAI
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash .github/scripts/android-smoke.sh

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RisuAI-Android-emulator-diagnostics
          path: |
            android-activity.txt
            android-deep-link.txt
            android-install.txt
            android-launch.txt
            android-logcat.txt
            android-package.txt
            android-relaunch.txt
            android-smoke.png
            android-x86_64-size.txt
          if-no-files-found: warn
          retention-days: 14

  build-full-release:
    name: Build signed ARM64 APK and multi-ABI AAB
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.build_full_release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build
        with:
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Require Android signing secrets
        shell: bash
        run: |
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_BASE64"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"

      - name: Build ARM64 release APK
        run: pnpm tauri android build --apk --target aarch64 --split-per-abi --ci

      - name: Stage unsigned ARM64 APK
        shell: bash
        run: |
          mkdir -p android-output
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" android-output/RisuAI-Android-arm64-release-unsigned.apk

      - name: Build multi-ABI release AAB
        run: pnpm tauri android build --aab --ci

      - name: Sign release APK and AAB
        shell: bash
        run: |
          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          unsigned_apk=android-output/RisuAI-Android-arm64-release-unsigned.apk
          aligned_apk=android-output/RisuAI-Android-arm64-release-aligned.apk
          signed_apk=android-output/RisuAI-Android-arm64-release.apk
          aab="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$aab"
          "$build_tools/zipalign" -P 16 -f 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/android-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEY_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          cp "$aab" android-output/RisuAI-Android-release.aab
          jarsigner \
            -keystore "$RUNNER_TEMP/android-release.jks" \
            -storepass "$ANDROID_KEY_STORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            android-output/RisuAI-Android-release.aab \
            "$ANDROID_KEY_ALIAS"
          rm "$unsigned_apk" "$aligned_apk"

      - name: Verify and measure signed release artifacts
        shell: bash
        env:
          ANDROID_EXPECTED_ABI: arm64-v8a
          ANDROID_MAX_APK_BYTES: '134217728'
          ANDROID_SIZE_REPORT: android-release-size.txt
        run: |
          bash .github/scripts/android-artifact-report.sh \
            android-output/RisuAI-Android-arm64-release.apk \
            android-output/RisuAI-Android-release.aab

      - name: Read application version
        id: app-version
        shell: bash
        run: echo "value=$(jq -r '.version' version.json)" >> "$GITHUB_OUTPUT"

      - name: Upload signed ARM64 APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RisuAI-Android-release-arm64-v${{ steps.app-version.outputs.value }}
          path: |
            android-output/RisuAI-Android-arm64-release.apk
            android-release-size.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload signed multi-ABI AAB
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RisuAI-Android-release-aab-v${{ steps.app-version.outputs.value }}
          path: android-output/RisuAI-Android-release.aab
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
