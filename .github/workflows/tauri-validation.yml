name: 'tauri-validation'

# Validation-only native builds. This workflow never creates tags, releases,
# or signed release updates (contents: read, no updater artifacts) and uploads
# only macOS disk images as run artifacts.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/tauri-validation.yml'
      - 'src/App.svelte'
      - 'src/lib/UI/DesktopTitleBar.svelte'
      - 'src/lib/Setting/Wrappers/SettingCheck.svelte'
      - 'src/lib/UI/GUI/CheckInput.svelte'
      - 'src/ts/gui/windowChrome.svelte.ts'
      - 'src/ts/gui/tests/windowChrome.test.ts'
      - 'src/ts/setting/advancedSettingsData.ts'
      - 'src/ts/setting/types.ts'
      - 'src/ts/setting/utils.ts'
      - 'src-tauri/capabilities/window-chrome.json'

permissions:
  contents: read

jobs:
  validate-tauri-build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: 'macos-latest' # Arm based macs (M1 and above).
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel builds cross-compiled from the arm64 runner.
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest' # x86_64 Linux (glibc).
            target: 'x86_64-unknown-linux-gnu'
            args: '--target x86_64-unknown-linux-gnu'
          - platform: 'windows-latest' # x86_64 Windows (MSVC).
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v6
      - name: install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.34.1
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: install dependencies (ubuntu only)
        if: matrix.settings.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        name: Setup Rust cache
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.settings.platform }}-${{ matrix.settings.target }}
      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: build tauri app (validation)
        shell: bash
        env:
          VITE_RISU_LEGAL_CONFIGURED: 'TRUE'
        run: >-
          pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          ${{ matrix.settings.args }}
      - name: upload validation artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: RisuAI-validation-${{ matrix.settings.target }}
          retention-days: 14
          if-no-files-found: 'error'
          path: src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg/*.dmg
