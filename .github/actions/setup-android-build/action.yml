name: Setup Android build
description: Install the shared toolchain and dependencies for Android artifact jobs

inputs:
  rust-targets:
    description: Comma-separated Rust Android targets to install
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6.4.0
      with:
        node-version: 24

    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.9
      with:
        cache: true
        cache_dependency_path: pnpm-lock.yaml

    - name: Setup Java
      uses: actions/setup-java@v5.5.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v6.2.0

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4.0.1
      with:
        packages: >-
          platform-tools
          platforms;android-36
          build-tools;36.0.0
          ndk;28.2.13676358

    - name: Select Android NDK
      shell: bash
      run: |
        echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

    - name: Setup Rust Android targets
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.93.0
        targets: ${{ inputs.rust-targets }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.1
      with:
        workspaces: src-tauri -> target
        prefix-key: v1-rust-registry-only
        key: android
        cache-targets: false

    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Initialize generated Android project
      shell: bash
      run: pnpm tauri android init --ci --skip-targets-install

    - name: Configure Android permissions and SDK checks
      shell: bash
      run: node .github/scripts/configure-android.mjs
