[package]
name = "risuai"
version = "0.0.0"
description = "A Tauri App"
authors = ["RisuAI contributors"]
license = ""
repository = "https://github.com/kwaroran/RisuAI"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
serde_json = "1.0"
base64 = "0.22.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
tauri-plugin-fs = "=2.5.1"
tauri-plugin-os = "=2.3.2"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-http = "=2.5.9"
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-notification = "=2.3.3"
tokio = { version = "1.47.1", features = ["macros", "sync", "time"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "risuai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "=2.11.5", features = ["devtools"] }
tauri-plugin-single-instance = { version = "=2.4.2", features = ["deep-link"] }
tauri-plugin-updater = "=2.10.1"
oauth2 = "5.0.0"
zip = "0.6.6"
tar = "0.4.40"
